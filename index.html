<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BE BEAUTY CAM</title>
<meta name="google-site-verification" content="PASTE_YOUR_GOOGLE_CODE_HERE">
<style>body{margin:0;font-family:Inter;background:#000} #mainV{width:100%;height:100vh;object-fit:cover;position:fixed;top:0;left:0;transform:none!important} #filters{position:fixed;bottom:90px;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;display:none;gap:12px;overflow:auto;padding:12px;z-index:10;white-space:nowrap} .bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#000;display:flex;justify-content:space-around;padding:12px 0 20px;border-radius:20px 20px 0 0;z-index:11} .cam{width:74px;height:74px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-40px;border:4px solid #fff;font-size:24px} .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;color:#000;z-index:99;overflow:auto;padding:14px}</style></head><body>

<video id="mainV" autoplay playsinline></video>
<canvas id="preview" style="display:none"></canvas>
<div id="filters"></div>

<div class="bottom">
<div onclick="projModal.style.display='block'">📁<br>Projects</div>
<div onclick="filters.style.display='flex'">✨<br>Filters</div>
<div class="cam" onclick="let f=document.getElementById('filters');f.style.display=f.style.display=='flex'?'none':'flex'">📷</div>
<div onclick="alert('Shorts coming soon - Reels removed')">▶️<br>Shorts</div>
<div onclick="profileModal.style.display='block'">👤<br>Profile</div>
</div>

<div id="projModal" class="modal"><h3 onclick="this.parentElement.style.display='none'">← Projects</h3><input type="file" id="fileInput" accept="video/*,image/*"><p>Canva Tools: Trim, Cut, Text, Stickers, Music, Effects, Export</p></div>
<div id="profileModal" class="modal"><h3 onclick="this.parentElement.style.display='none'">← Profile</h3><button onclick="alert('Login Done')">Login</button></div>
<div id="payModal" style="display:none;position:fixed;top:40%;left:10%;width:80%;background:#fff;color:#000;border-radius:16px;padding:20px;z-index:999;text-align:center;box-shadow:0 10px 30px #0005"><h3>🔒 Premium LENS</h3><p>Is filter ke liye $2.99 pay karo</p><button onclick="this.parentElement.style.display='none'" style="background:#000;color:#fff;padding:10px 20px;border-radius:20px">Pay Now</button><br><button onclick="this.parentElement.style.display='none'" style="margin-top:10px">Close</button></div>

<script>
const mainV=document.getElementById('mainV');
const filters=document.getElementById('filters');
const list=[
{n:'Fox Eye',lens:false},{n:'Barbie LENS',lens:true},{n:'Douyin',lens:false},{n:'E-Girl LENS',lens:true},{n:'Dramatic',lens:false},{n:'Natural',lens:false},{n:'Soft LENS',lens:true},{n:'Baby Face',lens:false},{n:'Bold Glam',lens:false},{n:'Cat Eye LENS',lens:true},{n:'Clear Skin',lens:false},{n:'Rosy LENS',lens:true},{n:'Angel',lens:false},{n:'Honey LENS',lens:true},{n:'Smokey',lens:false},{n:'Crystal LENS',lens:true}
];
list.forEach(x=>{
let d=document.createElement('div');d.style.display='inline-block';d.style.textAlign='center';d.style.marginRight='14px';
d.innerHTML=`<div style="width:62px;height:62px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;border:2px solid #000;font-size:10px">${x.lens?'LENS':''}👩</div><span style="font-size:11px">${x.n}</span>`;
d.onclick=()=>{if(x.lens){document.getElementById('payModal').style.display='block';}else{mainV.style.filter='brightness(1.1)';filters.style.display='none';}};
filters.appendChild(d);
});
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>mainV.srcObject=s);
function takePhoto(){}
</script>
</body></html>
